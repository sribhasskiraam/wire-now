<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wire Now — Sri Lanka news in 30 seconds</title>
<meta name="description" content="Sri Lanka and world news as quick swipe cards. Know what happened in 30 seconds.">
<meta name="theme-color" content="#FF6B4A">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wire Now">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:image" content="logo.png">
<meta name="google-site-verification" content="NjE4oWu6vCxNB0jU_uby--yRorWmMFBxETh2NLn3I9I" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8F3; --card:#fff; --ink:#1E1B2E; --muted:#6B6880; --line:#F0E6DE;
    --acc:#FF6B4A; --acc2:#FFB23F; --soft:#FFE9E1;
    --Politics:#6C63FF; --Economy:#00A884; --Business:#0091EA; --Sports:#FF8F00;
    --Tech:#7C4DFF; --Health:#E91E63; --Weather:#0097A7; --Entertainment:#D81B60; --Astrology:#5E35B1; --Society:#8D6E63;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  a{color:inherit}

  /* header */
  header{position:sticky;top:0;z-index:5;background:rgba(255,248,243,.94);backdrop-filter:blur(8px);padding:12px 16px 6px}
  .top{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto}
  .logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;letter-spacing:-.5px}
  .bolt{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:20px;box-shadow:0 4px 12px rgba(255,107,74,.35)}
  .stats{margin-left:auto;display:flex;gap:6px}
  .pill{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;font-weight:800;font-size:14px}
  .tg{background:#229ED9;color:#fff;border-color:#229ED9;text-decoration:none;display:none}
  .tabs,.topics{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:720px;margin:10px auto 0;padding-bottom:4px}
  .tabs::-webkit-scrollbar,.topics::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:8px 14px;border-radius:14px;font-weight:800;font-size:15px;background:var(--card);border:1.5px solid var(--line)}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .topic{flex:none;padding:5px 12px;border-radius:999px;font-weight:700;font-size:13px;background:var(--soft);color:var(--ink)}
  .topic.on{background:var(--acc);color:#fff}

  main{max-width:720px;margin:0 auto;padding:8px 16px 60px}
  .hello{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:22px;padding:16px 18px;margin:8px 0 16px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(255,107,74,.25)}
  .hello b{font-size:18px;display:block}
  .hello span{opacity:.92;font-size:14px}
  .hello .big{font-size:38px}
  .upd{color:var(--muted);font-size:13px;margin:0 2px 10px}
  h2.sec{font-size:17px;font-weight:900;margin:22px 2px 10px}

  /* feels like an app (like WhatsApp): only the news itself can be selected and copied, no tap flashes,
     no double-tap zoom, no browser menus on long-press, no accidental pull-to-refresh */
  html,body{overscroll-behavior-y:contain}
  *{-webkit-tap-highlight-color:transparent}
  button,a,.story,.topic,.pill{touch-action:manipulation}
  img{-webkit-user-drag:none;user-drag:none}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .actbar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:70;display:flex;gap:8px;padding:8px;border-radius:18px;background:var(--ink);box-shadow:0 8px 30px rgba(0,0,0,.25);animation:up .15s ease-out}
  .actbar button{flex:1;color:#fff;font-weight:900;font-size:15px;padding:12px 4px;border-radius:12px;background:rgba(255,255,255,.08)}
  .story.held{transform:scale(.97);box-shadow:0 0 0 3px var(--acc)}
  .installbtn{display:none}
  .checkbtn{display:block;width:100%;text-align:left;margin:0 0 14px;padding:14px 16px;border-radius:22px;background:var(--card);box-shadow:0 2px 0 var(--line)}
  .checkbtn b{display:block;font-size:16px;font-weight:900} .checkbtn span{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-top:3px}
  .chkbox textarea{width:100%;min-height:110px;border-radius:14px;border:2px solid var(--line);padding:12px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);resize:vertical}
  .verdict{margin-top:14px;padding:14px;border-radius:16px;font-weight:800;line-height:1.45}
  .verdict .v{font-size:18px;font-weight:900;display:block;margin-bottom:6px}
  .v-confirmed{background:#e3f6ec;color:#1b6b45} .v-false{background:#fde7e4;color:#a12b1d} .v-misleading{background:#fff3d6;color:#7a5200} .v-unverified{background:#eef1f3;color:#455a64}
  .verdict a{display:block;margin-top:6px;font-size:13px;color:inherit;opacity:.85}
  .story .t,.story .b,.sc .txt,.sc li,.sc p,.cover h1,.quote,.fc .q,.src span,.rates .r span{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
  input,textarea{-webkit-user-select:text;user-select:text}

  /* story list */
  .story{display:block;width:100%;text-align:left;background:var(--card);border-radius:22px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 0 var(--line),0 6px 18px rgba(30,27,46,.06);transition:transform .12s}
  .story:active{transform:scale(.98)}
  .story .img{height:170px;background:var(--soft) center/cover no-repeat;position:relative}
  .story .img.none{height:auto;background:none}
  .icv{display:flex;align-items:center;gap:14px;padding:16px 18px;min-height:96px;background:color-mix(in srgb,var(--tc,var(--acc)) 14%,var(--card))}
  .icv .ib{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff;background:var(--tc,var(--acc))}
  .icv .l1{font-size:13px;font-weight:800;color:var(--muted)} .icv .l2{font-size:17px;font-weight:900;color:var(--ink);line-height:1.2}
  .cover .ci.noimg .icv{background:none;padding:0;min-height:0;flex:1} .cover .ci.noimg .icv .l1{color:#fff;opacity:.9} .cover .ci.noimg .icv .l2{color:#fff}
  .cover .ci.noimg .icv .ib{background:rgba(255,255,255,.25)}
  .ovl{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(rgba(20,18,28,0),rgba(20,18,28,.78))}
  .ovl .icv{background:none;min-height:0;padding:34px 14px 12px;gap:10px} .ovl .icv .ib{width:46px;height:46px;font-size:22px;background:rgba(255,255,255,.92);color:var(--acc)}
  .ovl .icv .l1{color:#fff;opacity:.85;font-size:12px} .ovl .icv .l2{color:#fff;font-size:15px}
  .tag{display:inline-block;color:#fff;font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px}
  .story .img .tag{position:absolute;left:12px;top:12px}
  .story .body{padding:12px 16px 14px}
  .story .t{font-size:18px;font-weight:900;line-height:1.25;margin:4px 0 6px}
  .story .b{color:var(--muted);font-size:14.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted);font-weight:700}
  .quick{margin-left:auto;background:var(--soft);color:var(--acc);padding:4px 10px;border-radius:999px;font-weight:900}
  .read .t{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-weight:700}
  .empty div{font-size:46px;margin-bottom:8px}
  .nums{display:flex;gap:10px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
  .num{flex:1;min-width:150px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 2px 0 var(--line)}
  .num .k{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .num .v{font-size:22px;font-weight:900;margin-top:2px}
  .num .s{font-size:12px;color:var(--muted);font-weight:700}
  .top5{background:var(--card);border-radius:22px;padding:14px 16px;margin:0 0 14px;box-shadow:0 2px 0 var(--line)}
  .top5 h3{margin:0 0 6px;font-size:16px;font-weight:900}
  .top5 button{display:flex;gap:10px;width:100%;text-align:left;padding:9px 0;border-top:1.5px dashed var(--line);font-weight:800;font-size:15px;line-height:1.3}
  .top5 button:first-of-type{border-top:0}
  .top5 .n{flex:none;width:26px;height:26px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:14px}
  .cov{color:var(--acc);font-weight:900}
  .badge{display:inline-block;font-weight:900;font-size:12px;padding:3px 9px;border-radius:999px;color:#fff;margin-right:6px}
  .badge.brk{background:#D32F2F} .badge.wrn{background:#F57C00}
  .warnbox{background:#FFF3E0;border:2px solid #FFB74D;border-radius:20px;padding:12px 14px;margin:0 0 14px}
  .warnbox h3{margin:0 0 6px;font-size:16px;font-weight:900;color:#E65100}
  .warnbox button{display:block;width:100%;text-align:left;padding:7px 0;font-weight:800;font-size:14.5px;line-height:1.3;border-top:1.5px dashed #FFCC80}
  .warnbox button:first-of-type{border-top:0}
  .fb{display:flex;gap:8px;width:100%} .fb a{flex:1;padding:10px 6px;border-radius:14px;background:var(--soft);color:var(--ink);font-weight:800;font-size:13px;text-align:center;text-decoration:none}
  .mycountry{max-width:720px;margin:6px auto 0;position:relative;font-size:13px;font-weight:800;color:var(--muted)}
  .mycountry button{color:var(--muted);font-weight:800}
  .mycountry select{position:absolute;left:0;top:0;opacity:0;width:220px;height:100%}
  .startbtn{margin-left:auto;flex:none;background:#fff;color:var(--acc);font-weight:900;font-size:16px;padding:10px 16px;border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .upnext{opacity:.85}
  .loc{font-size:13px;font-weight:800;color:var(--muted);margin:2px 0 -2px}
  .more{display:block;width:100%;padding:14px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-weight:900;margin:4px 0 10px}
  .share3{display:flex;gap:8px;width:100%}
  .share3 a{flex:1;padding:12px 6px;border-radius:14px;color:#fff;font-weight:900;font-size:14px;text-align:center;text-decoration:none}
  footer{max-width:720px;margin:0 auto;padding:10px 16px 40px;color:var(--muted);font-size:13px;font-weight:700;text-align:center}
  footer a{color:var(--acc)}

  /* story viewer */
  #viewer{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
  #viewer.open{display:flex}
  .vbar{display:flex;gap:4px;padding:12px 14px 6px}
  .vbar i{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
  .vbar i b{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
  #viewer{touch-action:manipulation}
  .sheet{position:fixed;inset:0;z-index:60;background:rgba(20,18,28,.5);display:none;align-items:flex-end;justify-content:center}
  .sheet.open{display:flex}
  .sheetbox{background:var(--card);width:100%;max-width:560px;max-height:80vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .sheetbox h3{margin:0 0 4px;font-size:17px}
  .sheetbox .src{display:block;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;color:var(--ink);text-decoration:none}
  .sheetbox .src b{display:block;font-size:13px;color:var(--acc)}
  .sheetbox .src span{font-size:14.5px;font-weight:600}
  .sheetbox .quote{background:var(--soft);border-radius:14px;padding:12px;margin:10px 0 4px;font-size:15px;line-height:1.55}
  @media (max-width: 420px){ #streak{display:none} .logo{white-space:nowrap} }
  .ratebox{cursor:pointer}
  .rates .r{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-weight:700}
  .rates .r b{margin-left:auto;font-size:17px}
  .rates .up{color:#2e9e6a;font-size:13px;min-width:62px;text-align:right} .rates .dn{color:#d84a3a;font-size:13px;min-width:62px;text-align:right} .rates .eq{color:var(--muted);font-size:13px;min-width:62px;text-align:right}
  .chart{width:100%;height:150px;display:block}
  .chips2{display:flex;gap:6px;overflow-x:auto;margin:8px 0;scrollbar-width:none}
  .chips2 button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px}
  .chips2 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .numgrid{background:var(--card);border-radius:20px;padding:14px;margin:0 0 14px;box-shadow:0 2px 0 var(--line)}
  .numgrid h3{margin:0 0 8px;font-size:17px}
  .numgrid button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;font-size:15px;font-weight:700;color:var(--ink)}
  .numgrid button:first-of-type{border-top:0}
  .numgrid .src{color:var(--muted);font-size:12.5px;font-weight:700}
  .listenrow{display:flex;gap:8px;margin:-4px 0 14px} .listenrow .listenbtn{margin:0} .voicebtn{flex:0 0 auto;width:auto!important;padding:12px 14px!important}
  .vlist button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--line);font-weight:700;color:var(--ink);background:none}
  .vlist button.on{color:var(--acc)} .vguide{margin-top:14px;padding:12px;border-radius:14px;background:var(--bg);border:1.5px dashed var(--line)} .vlist .note{margin-left:auto}
  .listenbtn{display:block;width:100%;margin:-4px 0 14px;padding:12px;border-radius:16px;background:var(--card);box-shadow:0 2px 0 var(--line);font-weight:900;font-size:15px;color:var(--ink)}
  .fc{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 0 var(--line)}
  .fc .q{font-weight:800;margin:4px 0}
  .fc .d{background:#FFF4E5;border-radius:12px;padding:10px;font-size:14.5px;margin-top:6px}
  .fc a{color:var(--acc);font-weight:800;font-size:14px}
  .vtop{display:flex;align-items:center;gap:10px;padding:4px 14px 8px;font-weight:800;font-size:14px;color:var(--muted)}
  .vtop .x{margin-left:auto;font-size:24px;width:40px;height:40px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
  .slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .slides::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;padding:6px 18px 18px;display:flex;align-items:stretch}
  .sc{flex:1;max-width:620px;margin:0 auto;background:var(--card);border-radius:28px;padding:26px 24px;box-shadow:0 2px 0 var(--line),0 10px 30px rgba(30,27,46,.08);display:flex;flex-direction:column;overflow-y:auto}
  .sc .emoji{font-size:44px}
  .sc .lbl{font-weight:900;color:var(--acc);text-transform:uppercase;letter-spacing:.08em;font-size:13px;margin:10px 0 8px}
  .sc .txt{font-size:20px;line-height:1.5;font-weight:700}
  .sc .txt.m{font-size:18px} .sc .txt.l{font-size:16px}   /* longer text, smaller letters, never below 16px */
  .sc ul{padding:0;margin:4px 0 0;list-style:none}
  .sc li{font-size:19px;font-weight:700;line-height:1.4;padding:12px 0 12px 34px;border-bottom:1.5px dashed var(--line);position:relative}
  .sc li:before{content:"✓";position:absolute;left:0;top:11px;width:24px;height:24px;border-radius:8px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-size:14px;font-weight:900}
  .cover{padding:0;overflow:hidden}
  .cover .ci{height:46%;min-height:180px;background:var(--soft) center/cover no-repeat}
  .cover .cb{padding:20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
  .cover .cb .tag{align-self:flex-start}
  .cover .ci{position:relative;overflow:hidden}
  .cover .ci img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .ci.noimg{display:flex;align-items:flex-end;gap:10px;min-height:96px;height:auto;padding:18px 22px;background:linear-gradient(135deg,var(--tc,var(--acc)),var(--acc2))}
  .cover .ci.noimg .srcname{color:#fff;font-weight:900;font-size:22px;letter-spacing:.2px;text-shadow:0 1px 2px rgba(0,0,0,.18)}
  .cover .ci.noimg img.wn{width:34px;height:34px;border-radius:9px;opacity:.95;flex:none}
  .cover h1{font-size:26px;line-height:1.2;font-weight:900;margin:0}
  .hint{margin-top:auto;color:var(--muted);font-weight:800;font-size:14px}
  .end{align-items:center;text-align:center;justify-content:center;gap:12px}
  .end .big{font-size:60px}
  .btn{display:block;width:100%;padding:14px;border-radius:16px;font-weight:900;font-size:16px;text-align:center;text-decoration:none;background:var(--card);border:2px solid var(--line)}
  .btn.main{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 4px 0 #D9512F}
  .row{display:flex;gap:10px;width:100%}
  .note{font-size:12px;color:var(--muted);font-weight:700}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;opacity:0;transition:.2s;z-index:40;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media (min-width:700px){ .story .img{height:220px} }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo"><img src="logo.png" alt="" class="bolt" style="padding:0;object-fit:cover">Wire Now</div>
    <div class="stats">
      <select class="pill" id="langsel" aria-label="Language / භාෂාව / மொழி" style="font-weight:800;max-width:80px;padding:5px 4px"></select>
      <span class="pill" id="streak" title="Days in a row">🔥 0</span>
      <button class="pill installbtn" id="installbtn" data-i="install">📲 Install</button>
      <a class="pill tg" id="tg" target="_blank" rel="noopener">Telegram</a>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab" data-v="foryou" id="fytab" data-i="for_you">✨ For you</button>
    <button class="tab on" data-v="all" data-i="all">All</button>
    <button class="tab" data-v="mine" id="minetab">🇱🇰 Sri Lanka</button>
    <button class="tab" data-v="world" data-i="world">🌍 World</button>
    <button class="tab" data-v="saved" data-i="saved_tab">❤️ Saved</button>
    <button class="tab" data-v="factcheck" data-i="factcheck_tab">🔍 Fact check</button>
    <a class="tab" href="community/" style="color:var(--ink);text-decoration:none" title="Talk about the news" data-i="community">👥 Community</a>
  </div>
  <div class="topics" id="topics"></div>
  <div class="mycountry"><span id="likes"></span> <button id="countrybtn"></button><select id="countrysel" aria-label="Your country"></select></div>
</header>

<main>
  <div class="hello" id="hello"></div>
  <div class="nums" id="nums"></div>
  <div class="warnbox" id="warnbox" style="display:none"></div>
  <div class="top5" id="top5" style="display:none"></div>
  <div class="listenrow" id="listenrow" style="display:none"><button class="listenbtn" id="briefbtn" data-i="listen_brief">🎧 Listen to today's top news</button><button class="listenbtn voicebtn" id="voicebtn" data-i="voice_btn">🔊 Voice</button></div>
  <button class="checkbtn" id="checkbtn" style="display:none"><b data-i="chk_btn">🔍 Heard something? Check if it's true</b><span data-i="chk_btn_s">Paste a message or rumour. Wire Now checks it against real reports and fact-checkers.</span></button>
  <div class="numgrid" id="numgrid" style="display:none"></div>
  <div class="upd" id="upd" data-i="loading">Loading…</div>

  footer_note: ["Summaries are written by AI from the original reports and fact-checked. Always see the source for the full article.",

  fc_disagree: ["⚖️ Where news sites disagree", "⚖️ පුවත් වෙබ් අඩවි එකඟ නොවන තැන්", "⚖️ செய்தித் தளங்கள் முரண்படும் இடங்கள்"],
  fc_disagree_s: ["Different sites report different facts. Read both and check the sources.", "විවිධ වෙබ් අඩවි විවිධ කරුණු වාර්තා කරයි. දෙකම කියවා මූලාශ්‍ර පරීක්ෂා කරන්න.", "வெவ்வேறு தளங்கள் வெவ்வேறு தகவல்களைத் தருகின்றன. இரண்டையும் படித்து மூலங்களைச் சரிபாருங்கள்."],

  voice_t: ["🔊 Reading voice", "🔊 කියවන හඬ", "🔊 வாசிக்கும் குரல்"],
  voice_s: ["Tap a voice to hear it. Your choice is remembered on this phone.", "හඬක් ඇසීමට එය තට්ටු කරන්න. ඔබේ තේරීම මෙම දුරකථනයේ මතක තබා ගනී.", "ஒரு குரலைக் கேட்க அதைத் தட்டவும். உங்கள் தேர்வு இந்தத் தொலைபேசியில் நினைவில் வைக்கப்படும்."],

  speed: ["Speed", "වේගය", "வேகம்"],
  voice_sample: ["This is how the news will be read to you.", "ඔබට පුවත් කියවනු ලබන්නේ මෙලෙසයි.", "இப்படித்தான் உங்களுக்குச் செய்திகள் வாசிக்கப்படும்."],
  voice_more: ["Want more or better voices? Phone Settings → search \"Text-to-speech\" → Google → install voice data (free).", "තවත් හොඳ හඬ අවශ්‍යද? දුරකථන Settings → \"Text-to-speech\" සොයන්න → Google → හඬ දත්ත ස්ථාපනය කරන්න (නොමිලේ).", "மேலும் நல்ல குரல்கள் வேண்டுமா? தொலைபேசி Settings → \"Text-to-speech\" தேடவும் → Google → குரல் தரவை நிறுவவும் (இலவசம்)."],
  voice_get: ["🗣️ Get a better, natural voice (free, works offline)", "🗣️ වඩා හොඳ, ස්වාභාවික හඬක් ලබා ගන්න (නොමිලේ, අන්තර්ජාලය නැතිවත් ක්‍රියා කරයි)", "🗣️ சிறந்த, இயல்பான குரலைப் பெறுங்கள் (இலவசம், இணையம் இல்லாமலும் இயங்கும்)"],
  voice_steps: ["1. Open phone Settings and search \"Text-to-speech\". 2. Choose Google as the engine. 3. Tap ⚙️ → Install voice data. 4. Download English, Tamil and Sinhala (pick the voices marked high quality). 5. Come back and choose a voice here.",
    "1. දුරකථනයේ Settings විවෘත කර \"Text-to-speech\" සොයන්න. 2. Google තෝරන්න. 3. ⚙️ → Install voice data ඔබන්න. 4. ඉංග්‍රීසි, දෙමළ සහ සිංහල බාගත කරන්න (උසස් ගුණාත්මක හඬ තෝරන්න). 5. නැවත පැමිණ මෙහි හඬක් තෝරන්න.",
    "1. தொலைபேசி Settings-ஐத் திறந்து \"Text-to-speech\" எனத் தேடவும். 2. Google-ஐத் தேர்ந்தெடுக்கவும். 3. ⚙️ → Install voice data-ஐத் தட்டவும். 4. ஆங்கிலம், தமிழ், சிங்களம் ஆகியவற்றைப் பதிவிறக்கவும் (உயர் தரக் குரல்களைத் தேர்ந்தெடுக்கவும்). 5. திரும்பி வந்து இங்கே ஒரு குரலைத் தேர்ந்தெடுக்கவும்."],

const LI = { en: 0, si: 1, ta: 2 };
function T(k, v){ const row = TXT[k]; let s = row ? (lang in LI ? (row[LI[lang]] || row[0]) : (DYN.get(row[0]) || row[0])) : k;
  if(v) for(const x in v) s = s.split("{" + x + "}").join(v[x]); return s; }
const dyn = t => (t && DYN.get(t)) || t;
const TR = s => (lang !== "en" && s && s.tr && s.tr[lang]) || null;
/* every word in the reader's language: the robot's translation first, then the live translator; English is never shown in another language */
const trTitle = s => (TR(s) && TR(s).title) || DYN.get(s.title) || null;
const hasLang = s => lang === "en" || !!trTitle(s);
const titleOf = s => lang === "en" ? s.title : (trTitle(s) || T("translating"));
const W = t => lang === "en" ? t : (t && DYN.get(t)) || "";      // any other text: translated, or nothing
function cardsOf(s){
  if(!s.cards) return s.cards;
  if(lang === "en") return s.cards;
  if(TR(s) && TR(s).cards) return { ...s.cards, ...TR(s).cards };
  const c = s.cards;
  if(!W(c.what_happened)) return null;               // summary not translated yet: treated as headline-only, never English
  return { ...c, what_happened: W(c.what_happened), details: (c.details || []).map(W).filter(Boolean), why_it_matters: W(c.why_it_matters),
           key_facts: (c.key_facts || []).map(W).filter(Boolean), whats_next: W(c.whats_next), blurb: W(c.blurb),
           spoken: c.spoken && DYN.get(c.spoken), role: c.role && W(c.role) };
}
const untranslated = s => lang !== "en" && !trTitle(s);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---- this phone's own memory (saved stories, read stories, streak) ---- */
const mem = {
  get(k, d){ try{ const v = localStorage.getItem("wn_"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("wn_"+k, JSON.stringify(v)); }catch(e){} }
};
let saved = mem.get("saved", {});          // id -> story
let readIds = new Set(mem.get("read", []));
let streak = mem.get("streak", {days:0, last:"", today:0});
const todayStr = () => new Date().toLocaleDateString("en-CA");

let data = null, view = (mem.get("prof", {n: 0}).n >= 8) ? "foryou" : "all", topic = "All", current = null, currentList = [], limits = {};

function ago(iso){
  if(!iso) return "";
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if(m < 1) return T("just_now"); if(m < 60) return T("m_ago", {n: m});
  const h = Math.round(m / 60); if(h < 24) return T("h_ago", {n: h});
  return T("d_ago", {n: Math.round(h / 24)});
}
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1700); }
const cName = c => c === "Sri Lanka" && typeof T === "function" && lang in LI ? T("LK") : countryName(c);
const placeOf = p => lang === "en" ? p : (DYN.get(p) || "");
const locText = s => { const l = s.location; if(!l) return ""; const pl = l.place ? placeOf(l.place) : ""; const n = l.also ? [l.country, ...l.also].map(cName).join(" / ") : pl && l.country ? pl + ", " + cName(l.country) : (pl || cName(l.country) || ""); return n ? "📍 " + n + " " + (l.flag || "") : ""; };
const srcOf = x => lang === "en" ? x : (DYN.get(x) || x);
const tagHtml = t => `<span class="tag" style="background:var(--${esc(t)},#888)">${esc(T(t))}</span>`;
/* neutral picture when there is no good photo: initials for a person, an icon for a subject. Never a drawn face. */
const ICONS = [[/\b(parliament|budget debate|speaker of)\b/i, "🏛️", "ic_parl"], [/\b(court|courts|judge|verdict|bail|lawsuit)\b/i, "⚖️", "ic_court"],
  [/\b(peace talks|war|missiles?|military|army|airstrikes?|strike on|ceasefire|troops)\b/i, "🕊️", "ic_conflict"],
  [/\b(floods?|flooding|tsunami)\b/i, "🌊", "ic_flood"], [/\b(rain|rains|rainfall|showers|weather|monsoon|storms?|cyclone|met\. dept|thunder\w*)\b/i, "🌧️", "ic_weather"],
  [/\b(fire|fires|blaze|wildfire)\b/i, "🔥", "ic_fire"], [/\b(crash|crashes|accident|collision|derail\w*)\b/i, "🚨", "ic_accident"],
  [/\b(police|arrest\w*|murder\w*|suspects?|shooting|robbery|drugs)\b/i, "🚓", "ic_police"], [/\bcricket\b/i, "🏏", "ic_cricket"],
  [/\b(football|fifa)\b/i, "⚽", "ic_football"], [/\b(elections?|vote|votes|voting|polls|ballot)\b/i, "🗳️", "ic_election"],
  [/\b(rupee|dollar|inflation|imf|central bank|cbsl|economy|tax|taxes|budget|prices?)\b/i, "💰", "ic_economy"],
  [/\b(hospitals?|health|dengue|virus|disease|doctors?)\b/i, "🏥", "ic_health"], [/\b(schools?|exams?|university|students?)\b/i, "🎓", "ic_education"],
  [/\b(airport|flights?|airlines?)\b/i, "✈️", "ic_travel"], [/\b(microsoft|google|apple|outage|ai|software|internet|cyber\w*)\b/i, "💻", "ic_tech"]];
const TOPIC_ICON = { Politics: "🏛️", Economy: "💰", Business: "💼", Sports: "🏅", Tech: "💻", Health: "🏥", Weather: "🌧️", Entertainment: "🎬", Astrology: "✨", Society: "👥" };
function iconCover(s){
  const c = s.cards || {}, l = s.location || {};
  const where = l.place ? placeOf(l.place) : (l.country ? cName(l.country) : "");
  if(c.person){
    const ini = c.person.replace(/[^\p{L}\s.-]/gu, "").split(/[\s.-]+/).filter(w => w.length > 1).map(w => w[0].toUpperCase());
    const role = c.role ? (lang === "en" ? c.role : (DYN.get(c.role) || "")) : "";
    const who = [l.country ? cName(l.country) : "", role].filter(Boolean);
    return `<div class="icv"><div class="ib" style="font-size:24px">${esc((ini[0] || "") + (ini.length > 1 ? ini[ini.length - 1] : ""))}</div><div><div class="l1">${esc(who[0] || where)}</div><div class="l2">${esc(who[1] || T(s.topic))}</div></div></div>`;
  }
  const hit = ICONS.find(([re]) => re.test(s.title));
  return `<div class="icv"><div class="ib">${hit ? hit[1] : (TOPIC_ICON[s.topic] || "📰")}</div><div><div class="l1">${esc(where || T(s.topic))} ${l.flag || ""}</div><div class="l2">${esc(hit ? T(hit[2]) : T(s.topic))}</div></div></div>`;
}

/* ---- streak ---- */
function markRead(s){
  if(readIds.has(s.id)) return;
  readIds.add(s.id); mem.set("read", [...readIds].slice(-500)); like(s, 2);
  const t = todayStr();
  if(streak.last !== t){
    const y = new Date(Date.now() - 864e5).toLocaleDateString("en-CA");
    streak.days = streak.last === y ? streak.days + 1 : 1;
    streak.last = t; streak.today = 0;
  }
  streak.today++; mem.set("streak", streak);
  drawHeader();
}
function drawHeader(){
  const live = streak.last === todayStr() || streak.last === new Date(Date.now()-864e5).toLocaleDateString("en-CA");
  const days = live ? streak.days : 0, today = streak.last === todayStr() ? streak.today : 0;
  $("streak").textContent = "🔥 " + days;
  $("hello").innerHTML = today
    ? `<div class="big">🔥</div><div><b>${today === 1 ? T("story_today") : T("stories_today", {n: today})}${days > 1 ? T("day_streak", {n: days}) : ""}</b><span>${T("keep_going")}</span></div>`
    : `<div class="big">⚡</div><div><b>${T("hello_t")}</b><span>${T("hello_s")}</span></div>`;
  $("hello").innerHTML += `<button class="startbtn" id="startbtn">${T("start")}</button>`;
}

/* ---- personal "For you" feed: learns on this phone only, nothing is sent anywhere ---- */
let prof = mem.get("prof", {topics: {}, n: 0});
let openedAt = 0;
function like(s, w){
  if(!s || !s.topic) return;
  prof.topics[s.topic] = Math.max(-5, (prof.topics[s.topic] || 0) + w);
  prof.n++; mem.set("prof", prof); drawLikes();
}
const learned = () => prof.n >= 8;
function favTopics(){ return Object.entries(prof.topics).filter(([, v]) => v > 2).sort((a, b) => b[1] - a[1]).map(([t]) => t); }
function drawLikes(){
  const f = favTopics().slice(0, 3);
  $("likes").innerHTML = learned() && f.length
    ? `${T("you_like", {x: f.map(x => esc(T(x))).join(", ")})} · <button id="resetlikes" style="color:var(--acc);font-weight:800">${T("reset")}</button> ·`
    : "";
}
document.addEventListener("click", e => {
  if(e.target.id !== "resetlikes") return;
  prof = {topics: {}, n: 0}; mem.set("prof", prof); drawLikes();

function forYou(list){
  const vals = Object.values(prof.topics), max = Math.max(1, ...vals);
  const w = t => Math.max(0, (prof.topics[t] || 0)) / max;           // 0..1 how much they like the topic
  const urgent = list.filter(s => s.warning || s.breaking);           // always shown first, to everyone
  const rest = list.filter(s => !s.warning && !s.breaking);
  const scored = rest.map((s, i) => ({s, score: 0.65 * w(s.topic) + 0.35 * (1 - i / rest.length) + (isMine(s) ? 0.1 : 0)}));
  scored.sort((a, b) => b.score - a.score);
  const liked = scored.filter(x => w(x.s.topic) >= 0.34).map(x => x.s);
  const other = scored.filter(x => w(x.s.topic) < 0.34).map(x => x.s).sort((a, b) => (b.coverage || 1) - (a.coverage || 1));
  const out = [...urgent];
  while(liked.length || other.length){        // every 5th story is from another topic, so nobody is stuck in a bubble
    for(let k = 0; k < 4 && liked.length; k++) out.push(liked.shift());
    if(other.length) out.push(other.shift());
    if(!liked.length) out.push(...other.splice(0));

}

/* ---- translating into any language: once per text, saved for everyone ---- */
async function shaKey(t){ const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(d)].slice(0, 16).map(b => b.toString(16).padStart(2, "0")).join(""); }
const dynPending = new Set();
function loadDynCache(){ DYN.clear(); try{ const c = JSON.parse(localStorage.getItem("wn_tr_" + lang) || "{}"); for(const k in c) DYN.set(k, clean(c[k])); }catch(_){} }
function saveDynCache(){ try{ const o = {}; let n = 0; for(const [k, v] of DYN){ o[k] = v; if(++n > 1500) break; } localStorage.setItem("wn_tr_" + lang, JSON.stringify(o)); }catch(_){} }
async function dynTranslate(texts){
  if(lang === "en" || !LIVE || !window.crypto || !crypto.subtle) return false;
  const want = [...new Set(texts.filter(t => t && t.trim() && !DYN.has(t) && !dynPending.has(t)))];
  if(!want.length) return false;
  want.forEach(t => dynPending.add(t));
  const forLang = lang;
  let added = false;
  try{
    const keys = await Promise.all(want.map(shaKey)), byKey = Object.fromEntries(keys.map((k, i) => [k, want[i]]));
    for(let i = 0; i < keys.length; i += 40){        // 1. saved translations (free, instant)
      const r = await fetch(`${SBX.url}/rest/v1/translations?select=key,text&lang=eq.${forLang}&key=in.(${keys.slice(i, i + 40).join(",")})`, { headers: sbHead() });
      for(const row of (r.ok ? await r.json() : [])){ if(lang === forLang){ DYN.set(byKey[row.key], clean(row.text)); added = true; } }
    }
    const missing = want.filter(t => !DYN.has(t));
    for(let i = 0; i < missing.length && i < 120; i += 40){   // 2. new ones: the translator (a few batches at a time)
      const r = await fetch(`${SBX.url}/functions/v1/translate`, { method: "POST", headers: sbHead(),
        body: JSON.stringify({ lang: forLang, name: LANG_NAMES[forLang], country: myCode, texts: missing.slice(i, i + 40) }) });
      const j = r.ok ? await r.json() : {};
      for(const k in (j.out || {})){ if(lang === forLang && byKey[k]){ DYN.set(byKey[k], clean(j.out[k])); added = true; } }
      if(j.status === "busy") break;
    }
  }catch(_){}
  want.forEach(t => dynPending.delete(t));
  if(added){ saveDynCache(); clearTimeout(dynTranslate._t); dynTranslate._t = setTimeout(redrawAll, 120); }
  return added;
}
function redrawAll(){

  if(lang === "en") return;

function translateStory(s){

/* ---- 🔍 Is this true? (checks a claim against our Fact Base, fact-checkers and today's news) ---- */
function openCheck(prefill){
  $("sheetbox").innerHTML = `<div class="chkbox"><h3>${T("chk_t")}</h3>
    <textarea id="chkq" maxlength="600" placeholder="${esc(T("chk_ph"))}">${esc(prefill || "")}</textarea>
    <button class="btn" id="chkgo" style="margin-top:10px;background:var(--acc);color:#fff;border-color:var(--acc)">${T("chk_go")}</button>
    <div id="chkout"></div><div class="note" style="margin-top:12px">${T("chk_note")}</div>
    <button class="btn" style="margin-top:12px" id="sheetclose">${T("close")}</button></div>`;
  $("sheetclose").onclick = closeSheet;
  $("chkgo").onclick = async () => {
    const claim = $("chkq").value.trim();
    if(claim.length < 8){ $("chkout").innerHTML = `<div class="note" style="margin-top:8px;color:#a12b1d">${T("chk_short")}</div>`; return; }
    $("chkgo").disabled = true; $("chkout").innerHTML = `<div class="note" style="margin-top:10px">${T("chk_wait")}</div>`;
    let j = {};
    try{ const r = await fetch(`${SBX.url}/functions/v1/check`, { method: "POST", headers: sbHead(), body: JSON.stringify({ claim, lang }) }); j = r.ok ? await r.json() : {}; }catch(_){}
    $("chkgo").disabled = false;
    if(j.status === "busy"){ $("chkout").innerHTML = `<div class="verdict v-unverified">${T("chk_busy")}</div>`; return; }
    if(j.status !== "ok"){ $("chkout").innerHTML = `<div class="verdict v-unverified">${T("chk_fail")}</div>`; return; }
    const v = ["confirmed", "false", "misleading", "unverified"].includes(j.verdict) ? j.verdict : "unverified";
    $("chkout").innerHTML = `<div class="verdict v-${v}"><span class="v">${T("v_" + v)}</span>${esc(clean(j.explanation || ""))}
      ${(j.sources || []).map(x => x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">↗ ${esc(clean(x.source))}${x.date ? " · " + esc(x.date) : ""}</a>` : `<span class="note" style="display:block;margin-top:6px">${esc(clean(x.source))}${x.date ? " · " + esc(x.date) : ""}</span>`).join("")}</div>`;
  };
  $("sheet").classList.add("open");
  setTimeout(() => $("chkq") && $("chkq").focus(), 80);
}

/* ---- 💱 exchange rates + 📊 30-day chart ---- */
function chartSVG(vals, dates){
  if(!vals || vals.length < 2) return `<div class="note" style="padding:20px 0;text-align:center">${T("trend_wait")}</div>`;
  const W = 340, H = 150, P = 26, mn = Math.min(...vals), mx = Math.max(...vals), span = (mx - mn) || 1;
  const x = i => P + i * (W - 2 * P) / (vals.length - 1), y = v => H - P - (v - mn) / span * (H - 2 * P);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const up = vals[vals.length - 1] >= vals[0], col = up ? "#d84a3a" : "#2e9e6a";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="trend">
    <polyline points="${P},${H - P} ${pts} ${W - P},${H - P}" fill="${col}22" stroke="none"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round"/>
    <text x="${P}" y="14" font-size="11" fill="#6B6880">${mx}</text><text x="${P}" y="${H - 8}" font-size="11" fill="#6B6880">${mn}</text>
    <text x="${W - P}" y="${H - 8}" font-size="11" fill="#6B6880" text-anchor="end">${esc((dates[dates.length - 1] || "").slice(5))}</text>
    <text x="${P + 40}" y="${H - 8}" font-size="11" fill="#6B6880">${esc((dates[0] || "").slice(5))}</text></svg>`;
}
function openRates(){
  const n = data.numbers || {}, rates = n.rates || [], h = n.history || {dates: []};
  let pick = "USD";
  const draw = () => {
    const vals = h[pick] || [];
    $("sheetbox").innerHTML = `<h3>${T("rates_t")}</h3><div class="note">${T("rates_s")}</div>
      <div class="note" style="margin-top:10px;font-weight:800">${T("trend", {n: vals.length})}: ${esc(pick)}</div>
      ${chartSVG(vals, h.dates || [])}
      <div class="chips2">${rates.map(r => `<button data-c="${r.code}" class="${r.code === pick ? "on" : ""}">${r.flag} ${r.code}</button>`).join("")}</div>
      <div class="rates">${rates.map(r => {
        const ch = r.prev ? r.lkr - r.prev : 0, pct = r.prev ? (ch / r.prev * 100) : 0;
        const cls = !r.prev || Math.abs(pct) < 0.005 ? "eq" : ch > 0 ? "up" : "dn";
        return `<div class="r"><span>${r.flag}</span><span>${esc(r.name)} <span class="note">${r.code}</span></span><b>Rs. ${r.lkr.toLocaleString(undefined, {maximumFractionDigits: r.lkr < 1 ? 4 : 2})}</b>
          <span class="${cls}">${cls === "eq" ? "–" : (ch > 0 ? "▲ " : "▼ ") + Math.abs(pct).toFixed(2) + "%"}</span></div>`; }).join("")}</div>
      <button class="btn" style="margin-top:14px;width:100%" id="sheetclose">${T("close")}</button>`;
    $("sheetbox").querySelectorAll("[data-c]").forEach(b => b.onclick = () => { pick = b.dataset.c; draw(); });
    $("sheetclose").onclick = closeSheet;
  };
  draw(); $("sheet").classList.add("open");
}

/* ---- 📊 today in numbers: facts with numbers from the biggest stories ---- */
function drawNumbers(){
  const all = allStories(), top = (data.top || []).map(id => all.find(s => s.id === id)).filter(Boolean);
  const pool = [...top, ...all.filter(s => s.cards && !top.includes(s)).sort((a, b) => (b.coverage || 1) - (a.coverage || 1))];
  const rows = [], used = new Set();
  for(const s of pool){
    const c = cardsOf(s); if(!c || !c.key_facts) continue;
    const f = c.key_facts.find(x => /\d/.test(x));
    if(f && !used.has(s.id)){ used.add(s.id); rows.push([s, f]); }
    if(rows.length >= 5) break;
  }
  $("numgrid").style.display = rows.length ? "block" : "none";
  $("numgrid").innerHTML = `<h3>${T("numbers_t")}</h3>` + rows.map(([s, f]) =>
    `<button data-id="${esc(s.id)}">${esc(f)}<div class="src">${esc(titleOf(s))}</div></button>`).join("");
}

/* ---- 🎧 listen: the phone's own voice reads the news (no audio download, almost no data) ---- */
const VOICE_LANG = new Proxy({ en: ["en-GB", "en-US", "en-IN", "en"], si: ["si-LK", "si"], ta: ["ta-LK", "ta-IN", "ta"] }, { get: (o, k) => o[k] || [k] });
let speaking = false;
const lsGet = k => { try{ return localStorage.getItem(k); }catch(_){ return null; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, v); }catch(_){} };
const voiceRank = v => (/natural|neural|enhanced|premium|wavenet|network/i.test(v.name) ? 0 : 1) + (/google/i.test(v.name) ? 0 : 0.5);
function voicesFor(l){
  const vs = speechSynthesis.getVoices(), out = [];
  for(const code of VOICE_LANG[l]) vs.forEach(v => { if(!out.includes(v) && v.lang.replace("_", "-").toLowerCase().startsWith(code.toLowerCase())) out.push(v); });
  return out.sort((a, b) => voiceRank(a) - voiceRank(b));
}
function pickVoice(l){
  const list = voicesFor(l), saved = lsGet("wn_voice_" + l);
  return list.find(v => v.voiceURI === saved || v.name === saved) || list[0] || null;
}
const speechRate = () => parseFloat(lsGet("wn_rate")) || 1;
function openVoices(){
  if(!("speechSynthesis" in window)) return toast(T("no_speech"));
  let l = voicesFor(lang).length ? lang : "en";
  const draw = () => {
    const list = voicesFor(l), cur = pickVoice(l), r = speechRate();
    $("sheetbox").innerHTML = `<h3>${T("voice_t")}</h3><div class="note">${T("voice_s")}</div>
      <div class="note" style="margin-top:12px;font-weight:800">${T("speed")}</div>
      <div class="chips2">${[0.8, 0.9, 1, 1.1, 1.25].map(x => `<button data-r="${x}" class="${x === r ? "on" : ""}">${x}×</button>`).join("")}</div>
      <div class="vlist">${list.length ? list.map((v, i) => `<button data-v="${i}" class="${v === cur ? "on" : ""}">${v === cur ? "✓" : "▶"} ${T("voice_n", {n: i + 1})}<span class="note">${esc(v.lang)}</span></button>`).join("") : `<div class="note">${T("no_voices")}</div>`}</div>
      <div class="vguide"><b>${T("voice_get")}</b><div class="note">${T("voice_steps")}</div>
        ${/Android/i.test(navigator.userAgent) ? `<a class="btn" style="display:block;text-align:center;margin-top:8px" href="intent:#Intent;action=com.android.settings.TTS_SETTINGS;end">${T("voice_open")}</a>` : ""}</div>
      <button class="btn" style="margin-top:14px;width:100%" id="sheetclose">${T("close")}</button>`;
    $("sheetbox").querySelectorAll("[data-r]").forEach(b => b.onclick = () => { lsSet("wn_rate", b.dataset.r); sample(pickVoice(l)); draw(); });
    $("sheetbox").querySelectorAll("[data-v]").forEach(b => b.onclick = () => { const v = list[+b.dataset.v]; lsSet("wn_voice_" + l, v.voiceURI || v.name); sample(v); draw(); });
    $("sheetclose").onclick = () => { try{ speechSynthesis.cancel(); }catch(_){} closeSheet(); };
  };
  const sample = v => { if(speaking) stopSpeaking(); speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(l === lang ? T("voice_sample") : "This is how the news will be read to you."); if(v){ u.voice = v; u.lang = v.lang; } u.rate = speechRate(); speechSynthesis.speak(u); };
  draw(); $("sheet").classList.add("open");
}
/* Listen explains, like a presenter: the AI's spoken script when there is one, otherwise the summary with spoken links.
   Never reads English in another language: an untranslated story is skipped. */
function storyText(s){
  // headlines are never read aloud: only full written sentences (the story's spoken script, or its summary)
  if(lang !== "en" && !trTitle(s)) return [];
  const c = cardsOf(s);
  if(c && c.spoken) return [c.spoken];
  if(c && c.what_happened){
    const parts = [c.what_happened];
    if(c.why_it_matters) parts.push(T("say_why"), c.why_it_matters);
    return parts.filter(t => t && !t.startsWith("🌐"));
  }
  return [];
}
function stopSpeaking(){ speaking = false; try{ speechSynthesis.cancel(); }catch(_){} $("vlisten").textContent = "🎧"; $("briefbtn").innerHTML = T("listen_brief"); }
function briefScript(){
  const b = data && data.brief;
  if(!b || !b.checked) return null;             // only bulletins that passed the editor check
  if(b[lang]) return b[lang];
  return lang !== "en" && b.en ? (DYN.get(b.en) || null) : (lang === "en" ? b.en : null);
}
function speakStories(list, script){
  if(!("speechSynthesis" in window)) return toast(T("no_speech"));
  if(speaking){ stopSpeaking(); return; }
  const useLang = lang, voice = pickVoice(lang);
  if(!voice && lang !== "en"){ toast(T("no_voice", {l: LANGS[lang]})); openVoices(); return; }   // no English reading in another language
  // the AI's own greeting or "welcome" lines are removed: exactly ONE greeting, from your own clock
  const greetLine = /^\s*(good (morning|afternoon|evening|night)|welcome|hello|සුබ |ආයුබෝවන්|வணக்கம்|காலை வணக்கம்|மதிய வணக்கம்|மாலை வணக்கம்|இரவு வணக்கம்)|your host|glad to have you|morning news|evening news/i;
  if(script) script = script.split(/(?<=[.!?।])\s+/).filter((x, n) => !(n < 3 && greetLine.test(x))).join(" ");
  const kept = script ? [] : list.filter(x => storyText(x).length);
  const said = script ? [[script]] : kept.map(storyText);
  if(!said.length){ toast(T("brief_wait")); return; }
  const brief = !script && said.length > 1, hr = new Date().getHours(), chunks = [];
  if(brief || script) chunks.push(T(hr >= 5 && hr < 12 ? "greet_m" : hr >= 12 && hr < 17 ? "greet_a" : hr >= 17 && hr < 21 ? "greet_e" : "greet_n"));
  if(brief) chunks.push(T("say_hello"));
  said.forEach((parts, n) => {
    if(brief && n > 0) chunks.push(kept[n].region === "world" && kept[n - 1].region !== "world" ? T("say_world") : T("say_nextstory"));
    parts.forEach(t => t.split(/(?<=[.!?।])\s+(?=[^\d])/).forEach(x => x.trim() && chunks.push(x.trim())));
  });
  if(brief) chunks.push(T("say_bye"));
  speaking = true; $("vlisten").textContent = "⏹"; $("briefbtn").innerHTML = T("stop");
  speechSynthesis.cancel();
  let i = 0;
  const next = () => {
    if(!speaking || i >= chunks.length){ stopSpeaking(); return; }
    const u = new SpeechSynthesisUtterance(chunks[i++]);
    if(voice){ u.voice = voice; u.lang = voice.lang; } else u.lang = VOICE_LANG[useLang][0];
    u.rate = speechRate(); u.onend = next; u.onerror = next;
    speechSynthesis.speak(u);
  };
  next();
}
if("speechSynthesis" in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; }
$("voicebtn").onclick = openVoices;
$("vlisten").onclick = () => current && speakStories([current]);
$("briefbtn").onclick = () => { const all = allStories(); speakStories((data.top || []).map(id => all.find(s => s.id === id)).filter(Boolean), briefScript()); };
$("numgrid").onclick = e => { const id = e.target.closest("[data-id]")?.dataset.id; if(id) openStory(id); };

/* ---- load ---- */
function openFromHash(){
  const m = location.hash.match(/^#s-([a-f0-9]+)$/);
  if(m && data) openStory(m[1]);
}
async function load(){
  try{
    const r = await fetch("news.json", { cache: "no-cache" });   // asks "changed?": unchanged = almost no data
    data = await r.json();
    await loadCountry();
    $("upd").textContent = data.updated ? T("updated", {t: ago(data.updated)}) : T("waiting");
    if(data.channel){ const tg = $("tg"); tg.href = "https://t.me/" + data.channel.replace("@",""); tg.style.display = "inline-block"; }
    drawExtras();
    if(!$("viewer").classList.contains("open")) render();
  }catch(e){
    $("upd").textContent = T("cant_load");
  }
}
window.addEventListener("hashchange", openFromHash);
drawHeader();
load().then(openFromHash);
setInterval(() => { if(!document.hidden) load(); }, 5 * 60 * 1000);   // no downloads while the tab is hidden
</script>
